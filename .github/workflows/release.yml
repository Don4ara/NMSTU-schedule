name: Release
on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Release Notes
        shell: bash
        run: |
          # Try to get the previous tag. If none exists, log all commits.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Generating notes for all commits."
            git log --pretty=format:"- %s" > release-notes.md
          else
            echo "Generating release notes from $PREV_TAG to HEAD"
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" > release-notes.md
          fi
          
          echo "Release Notes Content:"
          cat release-notes.md

      - name: Check Release Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Preparing release for version: $VERSION"
          echo "Ensure this version is updated in package.json before pushing if you want a new release."

      - name: Compile Source Code
        run: |
          npm exec tsc
          npm exec vite build

      - name: Publish Release (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec electron-builder -- --publish always --win -c.releaseInfo.releaseNotesFile=release-notes.md

      - name: Publish Release (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec electron-builder -- --publish always --mac -c.releaseInfo.releaseNotesFile=release-notes.md

      - name: Publish Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec electron-builder -- --publish always --linux -c.releaseInfo.releaseNotesFile=release-notes.md
