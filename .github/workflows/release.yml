name: Release
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Release Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Preparing release for version: $VERSION"

      - name: Compile Source Code
        run: |
          npm exec tsc
          npm exec vite build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm exec electron-builder -- --win --publish never

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm exec electron-builder -- --mac --publish never

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm exec electron-builder -- --linux --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/**/*Setup.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.blockmap
            release/**/*-mac.yml
            release/**/latest*.yml
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate Artifacts
        shell: bash
        run: |
          mkdir -p release-files
          # Copy all files, overwriting duplicates (keeps last one)
          find artifacts -type f \( -name "*Setup.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" -o -name "*-mac.yml" -o -name "latest*.yml" \) -exec cp {} release-files/ \;
          echo "Files to upload:"
          ls -lh release-files/

      - name: Generate Release Notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Generating notes for all commits."
            COMMITS=$(git log --pretty=format:"%s")
          else
            echo "Generating release notes from $PREV_TAG to HEAD"
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s")
          fi
          
          # Создаём временные файлы для категорий
          touch features.tmp fixes.tmp improvements.tmp other.tmp
          
          # Сортируем коммиты по категориям
          echo "$COMMITS" | while read -r line; do
            if [ -z "$line" ]; then continue; fi
            
            # Приводим к нижнему регистру для проверки
            lower_line=$(echo "$line" | tr '[:upper:]' '[:lower:]')
            
            # Определяем категорию по ключевым словам
            if echo "$lower_line" | grep -qE "(feat|добавлен|добавил|добавить|новый|новая|новое|реализован|создан|внедрен|add|implement|create)"; then
              echo "- $line" >> features.tmp
            elif echo "$lower_line" | grep -qE "(fix|исправлен|исправил|пофиксен|пофиксил|баг|bug|repair|resolve|fixed)"; then
              echo "- $line" >> fixes.tmp
            elif echo "$lower_line" | grep -qE "(improve|улучшен|улучшил|оптимизац|refactor|рефактор|update|обновлен|enhance|perf|performance)"; then
              echo "- $line" >> improvements.tmp
            else
              echo "- $line" >> other.tmp
            fi
          done
          
          # Собираем release notes
          echo "# 📋 Что нового в этом релизе" > release-notes.md
          echo "" >> release-notes.md
          
          if [ -s features.tmp ]; then
            echo "## ✨ Новые функции" >> release-notes.md
            echo "" >> release-notes.md
            cat features.tmp >> release-notes.md
            echo "" >> release-notes.md
          fi
          
          if [ -s fixes.tmp ]; then
            echo "## 🐛 Исправления" >> release-notes.md
            echo "" >> release-notes.md
            cat fixes.tmp >> release-notes.md
            echo "" >> release-notes.md
          fi
          
          if [ -s improvements.tmp ]; then
            echo "## ⚡ Улучшения" >> release-notes.md
            echo "" >> release-notes.md
            cat improvements.tmp >> release-notes.md
            echo "" >> release-notes.md
          fi
          
          if [ -s other.tmp ]; then
            echo "## 📝 Другие изменения" >> release-notes.md
            echo "" >> release-notes.md
            cat other.tmp >> release-notes.md
            echo "" >> release-notes.md
          fi
          
          # Очистка временных файлов
          rm -f features.tmp fixes.tmp improvements.tmp other.tmp
          
          echo "Release Notes Content:"
          cat release-notes.md

      - name: Get Version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
