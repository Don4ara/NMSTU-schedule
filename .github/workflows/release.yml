name: Release
on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Source Code
        run: |
          npm exec tsc
          npm exec vite build

      - name: Publish Release (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: npm exec electron-builder -- --publish always --win

      - name: Publish Release (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: npm exec electron-builder -- --publish always --mac

      - name: Publish Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: npm exec electron-builder -- --publish always --linux
