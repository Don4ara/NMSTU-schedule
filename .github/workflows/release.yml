name: Release
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - '.vscode/**'
      - '.idea/**'
      - 'docs/**'
      - '.editorconfig'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Release Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Preparing release for version: $VERSION"

      - name: Compile Source Code
        run: |
          npm exec tsc
          npm exec vite build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm exec electron-builder -- --win --publish never

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm exec electron-builder -- --mac --publish never

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm exec electron-builder -- --linux --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/**/*Setup.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.blockmap
            release/**/*-mac.yml
            release/**/latest*.yml
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate Artifacts
        shell: bash
        run: |
          mkdir -p release-files
          # Copy all files, overwriting duplicates (keeps last one)
          find artifacts -type f \( -name "*Setup.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" -o -name "*-mac.yml" -o -name "latest*.yml" \) -exec cp {} release-files/ \;
          echo "Files to upload:"
          ls -lh release-files/

      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: true
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
