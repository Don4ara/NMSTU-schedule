name: Release
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Release Version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Preparing release for version: $VERSION"

      - name: Compile Source Code
        run: |
          npm exec tsc
          npm exec vite build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm exec electron-builder -- --win --publish never

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm exec electron-builder -- --mac --publish never

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm exec electron-builder -- --linux --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/**/*Setup.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.blockmap
            release/**/*-mac.yml
            release/**/latest*.yml
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Generating notes for all commits."
            git log --pretty=format:"- %s" > release-notes.md
          else
            echo "Generating release notes from $PREV_TAG to HEAD"
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" > release-notes.md
          fi
          
          echo "Release Notes Content:"
          cat release-notes.md

      - name: Get Version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*Setup.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.blockmap
            artifacts/**/*-mac.yml
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
