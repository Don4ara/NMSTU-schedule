<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Shadcn Dark Theme Tokens */
            --background: #09090b;
            /* Глубокий черный (Zinc 950) */
            --foreground: #fafafa;
            /* Почти белый (Zinc 50) */
            --muted: #71717a;
            /* Приглушенный серый (Zinc 500) */
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            /* Отступ между спиннером и текстом */
            opacity: 0;
            /* Очень плавная анимация появления */
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.1s;
            /* Небольшая задержка, чтобы избежать мерцания при быстрой загрузке */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
                filter: blur(4px);
                /* Эффект расфокуса при появлении */
            }

            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* SVG Спиннер */
        .spinner {
            color: var(--foreground);
            /* Белый цвет для спиннера */
            width: 20px;
            /* Меньший размер для минимализма */
            height: 20px;
            animation: spin 1.2s linear infinite;
            opacity: 0.9;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .text {
            font-size: 0.875rem;
            /* 14px */
            font-weight: 400;
            /* Regular вес для легкости */
            color: var(--muted);
            /* Серый цвет текста */
            letter-spacing: -0.01em;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Легкая пульсация прозрачности текста */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Иконка Loader2 (Lucide) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="spinner">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>

        <!-- Текст -->
        <div class="text">Loading...</div>
    </div>
</body>

</html>
